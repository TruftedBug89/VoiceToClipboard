<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceToClipboard</title>
    <style>
        :root {
            --primary: #e63946;
            --primary-hover: #ff4d4d;
            --bg-glass: rgba(20, 20, 25, 0.85);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-dim: #a0a0ab;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            user-select: none;
            -webkit-app-region: drag;
        }

        /* Top control bar */
        #top-bar {
            position: absolute;
            top: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            -webkit-app-region: no-drag;
        }

        body:hover #top-bar {
            opacity: 1;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        /* Mic Button Wrapper with Visualizer Canvas */
        #mic-container {
            position: relative;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
        }

        #visualizer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 90px;
            height: 90px;
            pointer-events: none;
        }

        #mic-button {
            position: relative;
            z-index: 2;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-glass);
            border: 2px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-app-region: no-drag;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        #mic-button:hover {
            background: rgba(40, 40, 50, 0.95);
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #mic-button.recording {
            background: var(--primary);
            border-color: var(--primary-hover);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); transform: scale(1.05); }
            70% { box-shadow: 0 0 0 22px rgba(230, 57, 70, 0); transform: scale(1.12); }
            100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); transform: scale(1.05); }
        }

        #mic-icon {
            width: 26px;
            height: 26px;
            fill: white;
            transition: fill 0.3s ease;
        }

        /* Subtitles floating lyrics container */
        #subtitles-container {
            margin-top: 15px;
            width: 92%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(-8px);
            min-height: 45px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #subtitles-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #subtitles {
            background: var(--bg-glass);
            padding: 10px 22px;
            border-radius: 20px;
            display: inline-block;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(12px);
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            border: 1px solid var(--border-glass);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            max-width: 100%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        /* Settings Modal */
        #settings-modal {
            position: absolute;
            inset: 10px;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: scale(0.95);
            -webkit-app-region: no-drag;
        }

        #settings-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-dim);
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: var(--primary-hover);
        }

        .hotkey-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <!-- Top Action Buttons -->
    <div id="top-bar">
        <div class="icon-btn" id="settings-btn" title="Settings (API Key)">⚙️</div>
        <div class="icon-btn" id="close-btn" title="Quit App">✕</div>
    </div>

    <!-- Mic Button & Audio Visualizer Canvas -->
    <div id="mic-container">
        <canvas id="visualizer-canvas" width="90" height="90"></canvas>
        <div id="mic-button" title="Click or Press Ctrl+Alt+V to Record">
            <svg id="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>
    </div>

    <!-- Subtitles Floating Lyrics Box -->
    <div id="subtitles-container">
        <div id="subtitles">Press <span class="hotkey-badge">Ctrl+Alt+V</span> or click to record</div>
    </div>

    <!-- In-App Settings Modal -->
    <div id="settings-modal">
        <div class="modal-title">
            <span>⚙️ Settings</span>
            <div class="icon-btn" id="close-modal-btn">✕</div>
        </div>
        <div class="input-group">
            <label for="api-key-input">Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="Paste your GEMINI_API_KEY here..." />
        </div>
        <button class="btn-save" id="save-settings-btn">Save Key</button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
