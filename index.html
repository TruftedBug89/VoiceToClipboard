<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceToClipboard</title>
    <style>
        :root {
            --primary: #e63946;
            --primary-hover: #ff4d4d;
            --bg-glass: rgba(20, 20, 25, 0.85);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-dim: #a0a0ab;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            user-select: none;
        }

        /* Top control bar */
        #top-bar {
            position: absolute;
            top: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 5;
        }

        body:hover #top-bar {
            opacity: 1;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        /* Mic Button Wrapper with Visualizer Canvas */
        #mic-container {
            position: relative;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            cursor: grab;
        }

        #mic-container.dragging {
            cursor: grabbing;
        }

        #visualizer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 90px;
            height: 90px;
            pointer-events: none;
        }

        #mic-button {
            position: relative;
            z-index: 2;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-glass);
            border: 2px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        #mic-button:hover {
            background: rgba(40, 40, 50, 0.95);
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ===== Recording / Finish FX ===== */

        /* Breathing glow + scale while live */
        #mic-button.recording {
            background: var(--primary);
            border-color: var(--primary-hover);
            animation: mic-live 1.8s ease-in-out infinite;
        }

        @keyframes mic-live {
            0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(230, 57, 70, 0.55), 0 8px 25px rgba(0,0,0,0.5); }
            50%      { transform: scale(1.05); box-shadow: 0 0 34px rgba(230, 57, 70, 0.85), 0 8px 25px rgba(0,0,0,0.5); }
        }

        /* Springy pop on start (overrides mic-live while active) */
        #mic-button.pop {
            animation: mic-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes mic-pop {
            0%   { transform: scale(0.55); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.9); }
            70%  { transform: scale(1.18); box-shadow: 0 0 30px rgba(230, 57, 70, 0.8); }
            100% { transform: scale(1); }
        }

        /* Soft red aura behind the button */
        #mic-aura {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.6) 0%, rgba(230, 57, 70, 0.25) 45%, transparent 70%);
            filter: blur(8px);
            opacity: 0;
            transform: scale(0.7);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #mic-container.recording #mic-aura {
            opacity: 1;
            transform: scale(1);
            animation: aura-breathe 1.8s ease-in-out infinite;
        }

        @keyframes aura-breathe {
            0%, 100% { transform: scale(0.95); opacity: 0.75; }
            50%      { transform: scale(1.35); opacity: 1; }
        }

        /* Sonar rings radiating while recording */
        .sonar-ring {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(230, 57, 70, 0.85);
            opacity: 0;
            pointer-events: none;
        }

        #mic-container.recording .sonar-ring {
            animation: sonar 1.7s cubic-bezier(0.16, 0.6, 0.32, 1) infinite;
        }

        #mic-container.recording .ring-2 { animation-delay: 0.55s; }
        #mic-container.recording .ring-3 { animation-delay: 1.1s; }

        @keyframes sonar {
            0%   { transform: scale(0.9); opacity: 0.95; }
            100% { transform: scale(2.7); opacity: 0; }
        }

        /* Rotating conic indicator ring */
        .spin-ring {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(230, 57, 70, 0.95) 90deg, transparent 200deg, transparent 360deg);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        #mic-container.recording .spin-ring {
            opacity: 1;
            animation: spin 2.4s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mic -> Checkmark morph */
        #mic-icon {
            width: 26px;
            height: 26px;
            fill: white;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #check-icon {
            position: absolute;
            width: 26px;
            height: 26px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        #mic-button.show-check #mic-icon {
            opacity: 0;
            transform: scale(0.4) rotate(-30deg);
        }

        #mic-button.show-check #check-icon {
            opacity: 1;
            transform: scale(1);
            animation: check-draw 0.45s cubic-bezier(0.65, 0, 0.35, 1) 0.05s forwards;
        }

        @keyframes check-draw {
            to { stroke-dashoffset: 0; }
        }

        /* Submit (✓) icon shown while recording — click to finish & transcribe */
        #submit-icon {
            position: absolute;
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #4ade80;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transform: scale(0.5) rotate(90deg);
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        #mic-button.recording #mic-icon {
            opacity: 0;
            transform: scale(0.4) rotate(-30deg);
        }

        #mic-button.recording #submit-icon {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* Transcribing state: button breathes, ring spins fast */
        #mic-button.transcribing #submit-icon {
            opacity: 0;
            transform: scale(0.4) rotate(90deg);
        }

        #mic-button.transcribing #mic-icon {
            opacity: 1;
            transform: scale(1);
        }

        #mic-button.transcribing {
            animation: transcribing-pulse 1.4s ease-in-out infinite;
        }

        @keyframes transcribing-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(230, 57, 70, 0.35), 0 8px 25px rgba(0,0,0,0.5); }
            50%      { transform: scale(0.95); box-shadow: 0 0 22px rgba(230, 57, 70, 0.65), 0 8px 25px rgba(0,0,0,0.5); }
        }

        #mic-container.transcribing .spin-ring {
            opacity: 1;
            animation: spin 1.1s linear infinite;
            background: conic-gradient(from 0deg, transparent 0deg, #ff8a8a 80deg, #e63946 200deg, transparent 280deg);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        }

        /* Shockwave burst on finish */
        .burst-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
        }

        .burst-ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(230, 57, 70, 0.9);
        }

        #mic-button.burst .burst-ring {
            animation: burst 0.55s cubic-bezier(0.16, 0.6, 0.32, 1) forwards;
        }

        @keyframes burst {
            0%   { transform: scale(0.85); opacity: 1; }
            100% { transform: scale(2.9); opacity: 0; }
        }

        /* Widget takes a small breath on finish */
        #mic-container.finish {
            animation: container-breath 0.45s ease;
        }

        @keyframes container-breath {
            0%   { transform: scale(1.04); }
            60%  { transform: scale(0.97); }
            100% { transform: scale(1); }
        }

        /* Minimal status indicator (dot + text, no pill) */
        #status-badge {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-4px) scale(0.9);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.14em;
            color: var(--text-dim);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 5;
        }

        #status-badge.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .rec-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 6px rgba(230, 57, 70, 0.8);
            animation: rec-blink 1.1s ease-in-out infinite;
            flex-shrink: 0;
        }

        #status-badge.busy .rec-dot {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--primary);
            box-shadow: none;
            animation: spin 0.7s linear infinite;
        }

        #status-badge.done .rec-dot {
            background: #4ade80;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.8);
            animation: none;
        }

        #status-badge.err .rec-dot {
            animation: none;
            box-shadow: 0 0 6px rgba(230, 57, 70, 0.8);
        }

        #status-badge.dim .rec-dot {
            display: none;
        }

        @keyframes rec-blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.2; }
        }

        /* Settings Modal */
        #settings-modal {
            position: absolute;
            inset: 10px;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: scale(0.95);
        }

        #settings-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-dim);
        }

        #api-key-note {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        #api-key-note code {
            font-size: 10.5px;
            background: rgba(255, 255, 255, 0.08);
            padding: 1px 4px;
            border-radius: 4px;
        }

        #api-key-note a {
            color: var(--primary);
            text-decoration: none;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .modal-actions .btn-save {
            flex: 1;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: #b3283a;
        }

        .btn-remove {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: none;
            transition: background 0.2s, color 0.2s;
        }

        .btn-remove:hover {
            background: rgba(230, 57, 70, 0.15);
            color: #ff8f9d;
        }

        .btn-save:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <!-- Top Action Buttons -->
    <div id="top-bar">
        <div class="icon-btn" id="settings-btn" title="Settings (API Key)">⚙️</div>
        <div class="icon-btn" id="close-btn" title="Quit App">✕</div>
    </div>

    <!-- Mic Button & Audio Visualizer Canvas -->
    <div id="mic-container">
        <div id="mic-aura"></div>
        <canvas id="visualizer-canvas" width="90" height="90"></canvas>
        <div class="sonar-ring ring-1"></div>
        <div class="sonar-ring ring-2"></div>
        <div class="sonar-ring ring-3"></div>
        <div class="spin-ring"></div>
        <div id="mic-button" title="Click to record · Click again to submit · Drag to move · Ctrl+Alt+V">
            <svg id="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <svg id="submit-icon" viewBox="0 0 24 24">
                <path d="M5 12.5l4.5 4.5L19 7.5"/>
            </svg>
            <svg id="check-icon" viewBox="0 0 24 24">
                <path d="M5 12.5l4.5 4.5L19 7.5"/>
            </svg>
            <div class="burst-ring"></div>
        </div>
    </div>

    <!-- Minimal Status Indicator -->
    <div id="status-badge">
        <div class="rec-dot" id="status-dot"></div>
        <span id="status-text">REC</span>
    </div>

    <!-- In-App Settings Modal -->
    <div id="settings-modal">
        <div class="modal-title">
            <span>⚙️ Settings</span>
            <div class="icon-btn" id="close-modal-btn">✕</div>
        </div>
        <div class="input-group">
            <label for="api-key-input">Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="Paste your API key here..." autocomplete="off" />
            <div id="api-key-note"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-save" id="save-settings-btn">Save Key</button>
            <button class="btn-remove" id="remove-key-btn">Remove</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
