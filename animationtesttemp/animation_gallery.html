<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎆 Animation Gallery — Pick Your Favorite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07080d;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 28px 14px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(90deg, #e63946, #ff8f9d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.03em;
  }
  header p {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-top: 2px;
  }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    padding: 10px;
  }
  .cell {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.09);
    background: #10111a;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .cell:hover {
    border-color: rgba(230,57,70,0.5);
    box-shadow: 0 8px 40px rgba(230,57,70,0.15);
  }
  /* Make the 5th cell (Laser Crown) span the last column, rows 1-2 */
  .cell:nth-child(5) {
    grid-column: 3;
    grid-row: 1 / span 2;
  }
  .cell-label {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    background: rgba(0,0,0,0.55);
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    z-index: 10;
    pointer-events: none;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    flex: 1;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>🎆 VoiceToClipboard — Animation Showcase</h1>
    <p>Compare all 5 animation concepts side by side. Hover each panel to highlight it.</p>
  </div>
</header>

<div class="grid">
  <div class="cell">
    <div class="cell-label">1 ⚡ Quantum Neon Pulse</div>
    <iframe src="animation_1_quantum_neon.html" title="Quantum Neon"></iframe>
  </div>
  <div class="cell">
    <div class="cell-label">2 🛡️ Cyberpunk Hex Shield</div>
    <iframe src="animation_2_cyberpunk_hex.html" title="Cyberpunk Hex"></iframe>
  </div>
  <div class="cell">
    <div class="cell-label">3 💧 Fluid Liquid Blob</div>
    <iframe src="animation_3_liquid_blob.html" title="Liquid Blob"></iframe>
  </div>
  <div class="cell">
    <div class="cell-label">4 🌌 Cosmic Nebula</div>
    <iframe src="animation_4_cosmic_nebula.html" title="Cosmic Nebula"></iframe>
  </div>
  <div class="cell">
    <div class="cell-label">5 👑 Laser Crown HUD</div>
    <iframe src="animation_5_laser_crown.html" title="Laser Crown"></iframe>
  </div>
</div>
</body>
</html>
