<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Holographic Hexagon Shield Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05060a;
      --cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-purple: #b026ff;
      --emerald: #00ff88;
      --gold: #ffaa00;
      --hud-dim: rgba(0, 243, 255, 0.15);
      --font-hud: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0f7fc;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Cyberpunk Scanlines & Grid Overlay */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(rgba(18, 16, 26, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
        linear-gradient(90deg, rgba(255, 0, 85, 0.03), rgba(0, 243, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, rgba(5, 6, 10, 0.95) 80%);
      pointer-events: none;
      z-index: 1;
    }

    /* Outer Wrapper */
    .container {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .header-title {
      font-family: var(--font-hud);
      font-size: 1.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6), 0 0 20px rgba(0, 243, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title .tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border: 1px solid var(--cyan);
      background: rgba(0, 243, 255, 0.1);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    /* Hologram Canvas Container */
    .widget-viewport {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#cyber-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Core Mic Container Widget */
    .mic-container {
      position: relative;
      z-index: 4;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #151d2a 0%, #080c14 70%, #030508 100%);
      border: 2px solid rgba(0, 243, 255, 0.4);
      box-shadow: 
        0 0 20px rgba(0, 243, 255, 0.3),
        inset 0 0 15px rgba(0, 243, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mic-container:hover {
      transform: scale(1.05);
      border-color: var(--cyan);
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.6),
        inset 0 0 20px rgba(0, 243, 255, 0.4);
    }

    .mic-icon {
      width: 44px;
      height: 44px;
      fill: var(--cyan);
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.8));
      transition: all 0.3s ease;
    }

    /* State specifics for mic button */
    .mic-container.recording {
      border-color: var(--neon-magenta);
      box-shadow: 
        0 0 35px rgba(255, 0, 85, 0.7),
        inset 0 0 20px rgba(255, 0, 85, 0.4);
      animation: core-pulse 1.2s infinite alternate;
    }
    .mic-container.recording .mic-icon {
      fill: var(--neon-magenta);
      filter: drop-shadow(0 0 12px rgba(255, 0, 85, 0.9));
    }

    .mic-container.transcribing {
      border-color: var(--neon-purple);
      box-shadow: 
        0 0 35px rgba(176, 38, 255, 0.7),
        inset 0 0 20px rgba(176, 38, 255, 0.4);
    }
    .mic-container.transcribing .mic-icon {
      fill: var(--neon-purple);
      filter: drop-shadow(0 0 12px rgba(176, 38, 255, 0.9));
      animation: pulse-icon 0.8s infinite ease-in-out alternate;
    }

    .mic-container.done {
      border-color: var(--emerald);
      box-shadow: 
        0 0 35px rgba(0, 255, 136, 0.8),
        inset 0 0 20px rgba(0, 255, 136, 0.4);
    }
    .mic-container.done .mic-icon {
      fill: var(--emerald);
      filter: drop-shadow(0 0 12px rgba(0, 255, 136, 1));
    }

    @keyframes core-pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }
    @keyframes pulse-icon {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Status Badge Overlay */
    .status-badge {
      position: absolute;
      bottom: -35px;
      font-family: var(--font-hud);
      font-size: 0.75rem;
      letter-spacing: 2px;
      padding: 4px 12px;
      background: rgba(8, 12, 20, 0.9);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    /* Control Panel */
    .control-panel {
      background: rgba(10, 14, 24, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      padding: 20px 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 243, 255, 0.05);
      width: 420px;
    }

    .panel-title {
      font-family: var(--font-hud);
      font-size: 0.85rem;
      color: #8fa0b5;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .cyber-btn {
      font-family: var(--font-hud);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 10px 0;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: var(--cyan);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cyber-btn:hover {
      background: rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
      border-color: var(--cyan);
    }

    .cyber-btn.active {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
    }

    /* Special button colors */
    .cyber-btn.rec-btn.active { background: var(--neon-magenta); border-color: var(--neon-magenta); color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.8); }
    .cyber-btn.trans-btn.active { background: var(--neon-purple); border-color: var(--neon-purple); color: #fff; box-shadow: 0 0 15px rgba(176,38,255,0.8); }
    .cyber-btn.done-btn.active { background: var(--emerald); border-color: var(--emerald); color: #000; box-shadow: 0 0 15px rgba(0,255,136,0.8); }

    /* Audio Inputs & Sliders */
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      font-size: 0.8rem;
      color: #a0b2c6;
      display: flex;
      justify-content: space-between;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: #0f1724;
      height: 6px;
      border-radius: 3px;
      outline: none;
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 8px var(--cyan);
    }

    .mic-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .toggle-btn {
      padding: 8px 16px;
      font-family: var(--font-hud);
      font-size: 0.75rem;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .toggle-btn:hover {
      background: rgba(0, 255, 136, 0.25);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
    }
    .toggle-btn.active {
      background: var(--emerald);
      color: #05060a;
      font-weight: bold;
    }

    /* Stats readout */
    .hud-metrics {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-hud);
      font-size: 0.65rem;
      color: rgba(0, 243, 255, 0.6);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      CYBERPUNK HEX-SHIELD <span class="tag">OPTION 2</span>
    </div>

    <!-- Holographic Widget Display -->
    <div class="widget-viewport">
      <!-- Dynamic WebGL / Canvas Hexagon HUD Shield -->
      <canvas id="cyber-canvas" width="640" height="640"></canvas>

      <!-- Center Interactive Mic Button -->
      <div class="mic-container" id="mic-btn">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>

      <!-- Status Badge -->
      <div class="status-badge" id="status-badge">SYSTEM IDLE</div>
    </div>

    <!-- Simulation & Control Panel -->
    <div class="control-panel">
      <div class="panel-title">
        <span>State Control</span>
        <span id="fps-display">60 FPS</span>
      </div>

      <div class="btn-group">
        <button class="cyber-btn active" id="btn-idle" onclick="setState('idle')">IDLE</button>
        <button class="cyber-btn rec-btn" id="btn-rec" onclick="setState('recording')">RECORD</button>
        <button class="cyber-btn trans-btn" id="btn-trans" onclick="setState('transcribing')">PROCESS</button>
        <button class="cyber-btn done-btn" id="btn-done" onclick="setState('done')">DONE</button>
      </div>

      <div class="slider-row">
        <div class="slider-label">
          <span>Audio Level Simulation (peak glitch test)</span>
          <span id="level-val">0%</span>
        </div>
        <input type="range" id="audio-sim-slider" min="0" max="100" value="0">
      </div>

      <div class="mic-toggle-row">
        <span style="font-size: 0.85rem; color: #b0c4de;">Real Microphone Input:</span>
        <button class="toggle-btn" id="mic-toggle-btn" onclick="toggleRealMic()">ENABLE MIC</button>
      </div>

      <div class="hud-metrics">
        <span>ROTATION: <span id="rot-val">1.2 rad/s</span></span>
        <span>SHIELD INTEGRITY: <span id="shield-val">100%</span></span>
        <span>PEAK SHIFT: <span id="peak-val">NORMAL</span></span>
      </div>
    </div>
  </div>

  <script>
    // System State Variables
    let currentState = 'idle'; // 'idle', 'recording', 'transcribing', 'done'
    let audioLevel = 0; // 0 to 1
    let simulatedAudio = 0;
    let isRealMicActive = false;
    let audioCtx, analyser, micStream, dataArray;

    // UI Element References
    const micBtn = document.getElementById('mic-btn');
    const statusBadge = document.getElementById('status-badge');
    const slider = document.getElementById('audio-sim-slider');
    const levelVal = document.getElementById('level-val');
    const rotVal = document.getElementById('rot-val');
    const peakVal = document.getElementById('peak-val');
    const fpsDisplay = document.getElementById('fps-display');
    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');

    // Canvas size setup
    const size = 640;
    const center = size / 2;

    // Animation & Shield Variables
    let rotationAngle = 0;
    let hexGridAngle = 0;
    let glitchTimer = 0;
    let pulseWave = 0;
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    // Handle Mic Container Click
    micBtn.addEventListener('click', () => {
      if (currentState === 'idle') {
        setState('recording');
      } else if (currentState === 'recording') {
        setState('transcribing');
        setTimeout(() => {
          if (currentState === 'transcribing') setState('done');
        }, 2200);
      } else {
        setState('idle');
      }
    });

    // Slider Input
    slider.addEventListener('input', (e) => {
      simulatedAudio = parseFloat(e.target.value) / 100;
      levelVal.textContent = Math.round(simulatedAudio * 100) + '%';
    });

    // State Setter
    function setState(newState) {
      currentState = newState;
      
      // Update UI button highlights
      document.querySelectorAll('.btn-group .cyber-btn').forEach(btn => btn.classList.remove('active'));
      micBtn.className = 'mic-container';

      if (newState === 'idle') {
        document.getElementById('btn-idle').classList.add('active');
        statusBadge.textContent = 'SYSTEM IDLE';
        statusBadge.style.borderColor = 'var(--cyan)';
        statusBadge.style.color = 'var(--cyan)';
      } else if (newState === 'recording') {
        document.getElementById('btn-rec').classList.add('active');
        micBtn.classList.add('recording');
        statusBadge.textContent = '● RECORDING...';
        statusBadge.style.borderColor = 'var(--neon-magenta)';
        statusBadge.style.color = 'var(--neon-magenta)';
      } else if (newState === 'transcribing') {
        document.getElementById('btn-trans').classList.add('active');
        micBtn.classList.add('transcribing');
        statusBadge.textContent = '⚡ TRANSCRIBING...';
        statusBadge.style.borderColor = 'var(--neon-purple)';
        statusBadge.style.color = 'var(--neon-purple)';
      } else if (newState === 'done') {
        document.getElementById('btn-done').classList.add('active');
        micBtn.classList.add('done');
        statusBadge.textContent = '✓ COPIED TO CLIPBOARD';
        statusBadge.style.borderColor = 'var(--emerald)';
        statusBadge.style.color = 'var(--emerald)';
      }
    }

    // Toggle Real Mic Input via Web Audio API
    async function toggleRealMic() {
      const toggleBtn = document.getElementById('mic-toggle-btn');
      if (!isRealMicActive) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          const source = audioCtx.createMediaStreamSource(micStream);
          source.connect(analyser);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          isRealMicActive = true;
          toggleBtn.classList.add('active');
          toggleBtn.textContent = 'MIC ON (ACTIVE)';
          if (currentState === 'idle') setState('recording');
        } catch (err) {
          alert('Microphone access denied or unassigned: ' + err.message);
        }
      } else {
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        isRealMicActive = false;
        toggleBtn.classList.remove('active');
        toggleBtn.textContent = 'ENABLE MIC';
      }
    }

    // Draw Hexagon Helper
    function drawHexagon(ctx, x, y, radius, angleOffset = 0) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = angleOffset + (i * Math.PI) / 3;
        const hx = x + radius * Math.cos(a);
        const hy = y + radius * Math.sin(a);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
    }

    // Main Render Loop
    function render(timestamp) {
      // Calculate FPS
      frameCount++;
      if (timestamp - lastFrameTime >= 1000) {
        fps = frameCount;
        fpsDisplay.textContent = fps + ' FPS';
        frameCount = 0;
        lastFrameTime = timestamp;
      }

      // Read audio input level
      if (isRealMicActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioLevel = sum / (dataArray.length * 255);
        levelVal.textContent = Math.round(audioLevel * 100) + '%';
      } else {
        audioLevel = simulatedAudio;
      }

      // Clear Canvas
      ctx.clearRect(0, 0, size, size);

      // Speed up rotation based on state and audio level
      let speedMult = 1.0;
      if (currentState === 'recording') speedMult = 2.2 + audioLevel * 3.0;
      if (currentState === 'transcribing') speedMult = 4.5;
      if (currentState === 'done') speedMult = 0.5;

      rotationAngle += 0.015 * speedMult;
      hexGridAngle -= 0.008 * speedMult;
      pulseWave += 0.04;
      rotVal.textContent = (1.2 * speedMult).toFixed(1) + ' rad/s';

      // Color Theme Logic (Cyberpunk Neon Cyan / Purple / Emerald Glitch)
      let primaryColor = '#00f3ff';
      let secondaryColor = '#ff0055';
      let glowColor = 'rgba(0, 243, 255, ';

      if (currentState === 'recording') {
        primaryColor = audioLevel > 0.6 ? '#ff0055' : (audioLevel > 0.3 ? '#b026ff' : '#00f3ff');
        secondaryColor = '#00ff88';
        glowColor = audioLevel > 0.6 ? 'rgba(255, 0, 85, ' : 'rgba(0, 243, 255, ';
      } else if (currentState === 'transcribing') {
        primaryColor = '#b026ff';
        secondaryColor = '#00f3ff';
        glowColor = 'rgba(176, 38, 255, ';
      } else if (currentState === 'done') {
        primaryColor = '#00ff88';
        secondaryColor = '#00f3ff';
        glowColor = 'rgba(0, 255, 136, ';
      }

      // Check Peak Glitch Effect
      const isPeakGlitch = (audioLevel > 0.55 && currentState === 'recording');
      if (isPeakGlitch) {
        peakVal.textContent = 'GLITCH PEAK!';
        peakVal.style.color = '#ff0055';
      } else {
        peakVal.textContent = 'NORMAL';
        peakVal.style.color = 'inherit';
      }

      ctx.save();
      ctx.translate(center, center);

      // Apply Glitch offset if peak audio reached
      if (isPeakGlitch && Math.random() > 0.4) {
        ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
      }

      // --- LAYER 1: Matrix Energy Waves / Outer Ring Arc Segments ---
      const outerRadius = 135 + Math.sin(pulseWave) * 4 + audioLevel * 20;
      ctx.save();
      ctx.rotate(rotationAngle * 0.5);
      
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = primaryColor;

      // Dashed outer HUD arc segments
      ctx.beginPath();
      ctx.arc(0, 0, outerRadius, 0, Math.PI * 0.6);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, outerRadius, Math.PI * 0.8, Math.PI * 1.4);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, outerRadius, Math.PI * 1.6, Math.PI * 1.9);
      ctx.stroke();

      // Small HUD Tick Marks
      ctx.strokeStyle = secondaryColor;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 12; i++) {
        const a = (i * Math.PI) / 6;
        const x1 = (outerRadius + 8) * Math.cos(a);
        const y1 = (outerRadius + 8) * Math.sin(a);
        const x2 = (outerRadius + 14) * Math.cos(a);
        const y2 = (outerRadius + 14) * Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      ctx.restore();

      // --- LAYER 2: Concentric Holographic Hexagon Shield Grid ---
      ctx.save();
      ctx.rotate(hexGridAngle);

      const hexBaseRadius = 110 + audioLevel * 15;
      const numHexRings = 3;

      for (let r = 0; r < numHexRings; r++) {
        const ringRadius = hexBaseRadius + r * 12;
        const alpha = 0.8 - r * 0.25;

        ctx.strokeStyle = glowColor + alpha + ')';
        ctx.lineWidth = r === 0 ? 2.5 : 1.2;
        ctx.shadowBlur = r === 0 ? 12 : 5;
        ctx.shadowColor = primaryColor;

        drawHexagon(ctx, 0, 0, ringRadius, r * (Math.PI / 12));
        ctx.stroke();
      }

      // Draw Honeycomb / Hex Node Points
      ctx.fillStyle = primaryColor;
      ctx.shadowBlur = 10;
      ctx.shadowColor = primaryColor;

      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3;
        const nx = hexBaseRadius * Math.cos(a);
        const ny = hexBaseRadius * Math.sin(a);

        ctx.beginPath();
        ctx.arc(nx, ny, 3 + audioLevel * 4, 0, Math.PI * 2);
        ctx.fill();

        // Connect node points with laser arcs
        if (currentState === 'recording' || currentState === 'transcribing') {
          ctx.strokeStyle = secondaryColor;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(nx, ny);
          ctx.stroke();
        }
      }
      ctx.restore();

      // --- LAYER 3: Audio Spectrum Hexagon Energy Beams (When Recording/Speaking) ---
      if (currentState === 'recording' || audioLevel > 0.05) {
        ctx.save();
        ctx.rotate(-rotationAngle * 1.5);
        const numBars = 18;
        const innerRadius = 72;
        
        for (let i = 0; i < numBars; i++) {
          const angle = (i * Math.PI * 2) / numBars;
          const barHeight = 8 + audioLevel * 35 * (0.5 + 0.5 * Math.sin(i + pulseWave * 2));

          const x1 = innerRadius * Math.cos(angle);
          const y1 = innerRadius * Math.sin(angle);
          const x2 = (innerRadius + barHeight) * Math.cos(angle);
          const y2 = (innerRadius + barHeight) * Math.sin(angle);

          ctx.strokeStyle = i % 2 === 0 ? primaryColor : secondaryColor;
          ctx.lineWidth = 3;
          ctx.shadowBlur = 8;
          ctx.shadowColor = primaryColor;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // --- LAYER 4: Inner Holographic Pulse Ring ---
      ctx.save();
      ctx.rotate(rotationAngle * 2);
      const innerPulseRadius = 66 + Math.sin(pulseWave * 1.5) * 3;
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 12]);
      ctx.shadowBlur = 10;
      ctx.shadowColor = primaryColor;

      ctx.beginPath();
      ctx.arc(0, 0, innerPulseRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.restore(); // Restore center transform

      requestAnimationFrame(render);
    }

    // Start Animation
    requestAnimationFrame(render);
  </script>
</body>
</html>
